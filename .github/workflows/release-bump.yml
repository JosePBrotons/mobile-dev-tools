name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Run this workflow from master, not ${GITHUB_REF_NAME}."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" \
            --json conclusion,createdAt --jq 'sort_by(.createdAt) | last | .conclusion // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI on ${GITHUB_SHA} is '${conclusion}', not 'success'. Wait for it or fix it, then run again."
            exit 1
          fi
      - name: Compute next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --merged HEAD --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<<"${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v${major}.${minor}.${patch}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi
          echo "Latest ${latest}, bump ${BUMP}, next ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Create and push the tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/${TAG}"

  release:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
